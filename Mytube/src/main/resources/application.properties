spring.application.name=Mytube
server.port=8000
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-exclude=static/**,public/**
spring.redis.host=localhost
spring.redis.port=6379

mybatis.config-location=classpath:mybatis/sqlmap_config.xml
mybatis.mapper-locations=mybatis/**/*.xml

spring.thymeleaf.check-template-location=false

spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mytube-mysql:3306/mytube?serverTimezone=UTC&characterEncoding=UTF-8

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB

ffmpeg.path=/usr/bin/ffmpeg
ffprobe.path=/usr/bin/ffprobe

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.bootstrap-servers=mytube-kafka:9092
spring.kafka.consumer.group-id=myGroup
spring.kafka.producer.key-serializer: org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer: org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
kafka.encoding.topic=videoPath

logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=DEBUG
