version: "3"
services:
  mytube-mysql:
    container_name: mytube-mysql
    image: mysql
    restart: always
    env_file: .env
    ports:
      - 3306:3306
    volumes:
      - database:/var/lib/mysql

  mytube-zookeeper:
    container_name: mytube-zookeeper
    image: wurstmeister/zookeeper
    platform: linux/amd64
    ports:
      - "2181:2181"

  mytube-kafka:
    container_name: mytube-kafka
    image: wurstmeister/kafka:2.12-2.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: 127.0.0.1
      KAFKA_ZOOKEEPER_CONNECT: mytube-zookeeper:2181
      KAFKA_CREATE_TOPICS: "videoPath:5:1" # 토픽 이름:Partition 개수:Replica 개수
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mytube-zookeeper

  mytube-redis:
    container_name: mytube-redis
    image: redis
    ports:
      - 6379:6379
    command: redis-server

  mytube-backend:
    container_name: mytube-backend
    platform: linux/amd64
    build:
      context: .
    command: ./gradlew bootrun
    restart: on-failure
    ports:
      - 8000:8000
    expose:
      - 8000
    depends_on:
      - mytube-mysql
      - mytube-redis
      - mytube-kafka
    env_file: .env

  database:
    image: busybox
    volumes:
      - /var/lib/mysql
      - /var/log
volumes:
  database: