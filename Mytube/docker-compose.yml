version: "3"
services:
  mysql:
    container_name: Mytube-MySQL
    image: mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=0000
      - MYSQL_DATABASE=mytube
    ports:
      - 3306:3306
    volumes:
      - /var/lib/mysql

  my-tube:
    container_name: backend-container
    build:
      context: .
    command: ./gradlew bootrun
    restart: on-failure
    volumes:
      - .:/server
    ports:
      - 8000:8000
    expose:
      - 8000
    depends_on:
      - mysql
      - redis

  redis: # container name
    image: redis
    container_name: Mytube-Redis
    ports:
      - 6379:6379
    command: redis-server /usr/local/etc/redis/redis.conf


  zookeeper:
    image: wurstmeister/zookeeper
    container_name: Mytube-Zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka:2.12-2.5.0
    container_name: Mytube-Kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: 127.0.0.1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper

